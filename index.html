* { box-sizing: border-box; }

<script>
(() => {
'use strict';

// ===== src/js/00-i18n.js =====
//: Langues (ENG par défaut, FRA) : dictionnaires I18N, t(), translateDom
// ---------- Langues ----------
// Les textes de l'interface sont dans les dictionnaires I18N.en et I18N.fr (fichiers 00b et 00c).
// Les éléments du HTML portent data-i (texte), data-i-title, data-i-ph (placeholder) ou data-i-html (HTML).
const I18N = { en: {}, fr: {} };
let lang = 'en';
try { const l = localStorage.getItem('hexacorde.lang'); if (l === 'fr' || l === 'en') lang = l; } catch (_) { /* stockage inaccessible */ }
// texte traduit ; {0}, {1}... sont remplacés par les arguments
const t = (key, ...a) => {
  let s = I18N[lang][key];
  if (s === undefined) s = I18N.en[key] === undefined ? key : I18N.en[key];
  a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); });
  return s;
};
const NOTE_NAMES = {
  en: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'],
  fr: ['do', 'do#', 'ré', 'ré#', 'mi', 'fa', 'fa#', 'sol', 'sol#', 'la', 'la#', 'si'],
};
const NAMES = NOTE_NAMES[lang].slice();      // noms de notes dans la langue courante
function translateDom(root) {
  for (const e of root.querySelectorAll('[data-i]')) e.textContent = t(e.dataset.i);
  for (const e of root.querySelectorAll('[data-i-html]')) e.innerHTML = t(e.dataset.iHtml);
  for (const e of root.querySelectorAll('[data-i-title]')) e.title = t(e.dataset.iTitle);
  for (const e of root.querySelectorAll('[data-i-ph]')) e.placeholder = t(e.dataset.iPh);
}

// ===== src/js/00b-lang-en.js =====
//: Textes de l'interface en anglais
Object.assign(I18N.en, {
  "play": "Play",
  "pause": "Pause",
  "silence": "Silence",
  "silence.title": "Clear all pulses in flight",
  "step": "Step",
  "volume": "Volume",
  "bpm.title": "One step is an eighth note: BPM = 30000 / step in ms",
  "status": "step {0} · pulses {1}",
  "status.midi": " · MIDI {0} notes",
  "status.audio": " · audio {0} s",
  "status.stopped": " (stopped)",
  "grid.aria": "Hexagram grid {0}x{1}",
  "menu.tonality": "Tonality",
  "menu.hexagrams": "Hexagrams",
  "menu.settings": "Settings",
  "menu.sound": "Sound",
  "menu.midi": "MIDI",
  "menu.file": "File",
  "menu.draw": "Draw",
  "menu.help": "Help",
  "tonic": "Tonic",
  "octave": "Octave",
  "octave.title": "Base octave: shifts every sound",
  "scaleBase": "Scale",
  "scaleBase.title": "Base scale: applied to all hexagrams and used for new ones",
  "tonality.hint": "The tonic and the octave transpose everything. Each hexagram can also have its own (Hexagrams menu or right-click).",
  "tonic.global": "global tonic",
  "set.range": "Soft line range",
  "set.mutate": "Line mutation",
  "set.rotAll": "↻ all",
  "set.rotAll.title": "Rotate every hexagram by 60° at each step",
  "set.uniform": "Uniform octave",
  "set.uniform.title": "Same octave on every row (otherwise the grid spans 3 octaves, low rows low)",
  "set.theme": "Theme",
  "theme.dark": "Dark",
  "theme.light": "Light",
  "theme.sepia": "Sepia",
  "theme.green": "Green",
  "snd.internal": "Internal sound",
  "snd.wave": "Wave",

  "help.1": "<b>Click</b> a hexagon to prime it (this starts the clock). <b>Drag</b> its body to move it onto a free grid point. <b>Click a line</b> to toggle it solid / broken. <b>Drag a line</b> to rotate the hexagon in 60° steps; the <b>mouse wheel</b> does the same.",
  "help.2": "<b>Notes (chromatic)</b>: line 1 (top) C / C#, then clockwise D / D#, E / F, F# / G, G# / A, A# / B (in French: do / do#, ré / ré#...). Solid = natural note, broken = note + 1 semitone. The octave depends on the grid row.",
  "help.3": "<b>Notes (scales)</b>: side k plays degree k+1 of the scale (past the last note, it wraps up an octave). Solid line: the note is played and sent back. Broken line: silence, nothing is sent back, but pulses received always pass through. There are 23 scales.",
  "help.4": "<b>Sending</b>: each played line sends a pulse in its direction, toward the first hexagon of the sector. The farther it is, the more steps it takes.",
  "help.5": "<b>Solid line</b>: strong pulse, unlimited range; on arrival the side hit bounces (the hexagon starts to play). <b>Broken line</b>: soft pulse, short range; on arrival it passes through the hexagon without making it sound.",
  "help.6": "<b>Name</b>: each hexagram shows its number and its I Ching name (King Wen order). Line 1 of the hexagon is read as the first line of the hexagram (the bottom one in tradition); lines 4 to 6 form the upper trigram.",
  "help.7": "<b>Right-click a hexagon</b>: all its settings (hexagram, scale, channel, tonic, octave, rotation, 7th side, priming every N steps, reset), a 60° step, the <b>custom notes</b> (pick the note of the solid and of the broken line for each side, silence allowed; the notes of the scale are marked ● and coloured), <b>Reload the scale</b>, <b>Shuffle the order</b>, and <b>Deactivate</b> (greyed: it neither plays nor receives) or <b>Delete</b>.",
  "help.8": "<b>Right-click the grid</b>: add a new hexagram (random lines, the global scale and tonic) on the nearest free point, or set a custom grid size (columns x rows, 3 to 12 each). The grid spans 3 octaves, low rows low (tick <i>Uniform octave</i> in Settings for the same octave everywhere).",
  "help.9": "<b>Selection</b>: drag a rectangle on the empty grid to select several hexagrams (Shift adds, a click on the background clears). Right-click one of them to delete, deactivate or activate them all; the Delete key deletes too.",
  "help.10": "<b>Tonality</b> menu: tonic, octave and base scale for everything. Choosing a scale there applies it to all hexagrams and to the ones you add later. Each hexagram may override the tonic and add its own octave.",
  "help.11": "<b>Rotation</b> (per hexagon, in the Hexagrams menu): the hexagon turns in 60° steps. Speed ×1 = one 60° step per clock step, ×2 and ×3 = two or three, ÷2 to ÷8 = one step every 2 to 8 clock steps. Each line keeps its note, but its sending direction and the side hit on reception change. <b>7th side</b>: the hexagon becomes a heptagon (steps of 360/7 degrees).",
  "help.12": "<b>Live MIDI output</b>: <i>Enable MIDI</i> asks for access to the ports (Chrome, Edge or Firefox; not Safari), then pick the output. Firefox does not offer Web MIDI on a page opened from <code>file://</code>: run <code>python3 -m http.server</code> in the folder and open <code>http://localhost:8000</code>. Each hexagon has its channel (A = 1 by default). Untick <i>Internal sound</i> in the Sound menu to hear only the synth.",
  "help.13": "<b>Recording</b> (File menu): <i>Record MIDI</i> starts recording the notes (Pause does not stop it); <i>Save the recording</i> stops it and downloads <code>name-date.mid</code> (one track per hexagon, with its channel, one step = an eighth note). <i>Record audio</i> does the same for the internal sound, as <code>.flac</code> (lossless) or <code>.wav</code>.",
  "help.14": "<b>Setup</b> (File menu): the name is prefilled with <code>hexacorde_date_time</code>. <i>Save</i> keeps the layout, lines, scales, channels, rotations, sound and settings in the browser memory; <i>.json file</i> downloads it, <i>Open...</i> reloads it; <i>Text / Copy</i> writes it as text and <i>Apply</i> loads the text pasted in the box. Pulses in flight are not saved.",
  "help.15": "<b>Mutation</b> (Settings): a pulse of polarity opposite to the side it hits flips that line. <b>Theme</b> and <b>language</b> (ENG / FRA, top right) are remembered by the browser.",

const LABELS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';   // 26 hexagones au plus
// gammes : demi-tons depuis la tonique. null = chromatique (trait brisé = +1 demi-ton).
// Les noms sont dans les dictionnaires (clés scale.<clé> et scale.<clé>.s) ; les clés restent en français
// car elles sont écrites dans les setups. Pour ajouter une gamme : une ligne ici et ses deux noms dans 00b / 00c.
const SCALES = {

// ===== src/js/02-hexagrams.js =====

// numéro (1..64) de l'hexagramme formé par 6 traits
const hexNumber = lines =>
  KW[TRIGRAM[lines.slice(0, 3).join('')]][TRIGRAM[lines.slice(3, 6).join('')]];
// traits (6 bits) de l'hexagramme numéro n
const HEX_LINES = {};
for (let a = 0; a < 64; a++) {
  const lines = [5, 4, 3, 2, 1, 0].map(i => (a >> i) & 1);
  HEX_LINES[hexNumber(lines)] = lines;
}
// noms anglais (Wilhelm / Baynes) ; HEX_NAMES[n][1] donne le nom français
const HEX_EN = [null,
  'The Creative', 'The Receptive', 'Difficulty at the Beginning', 'Youthful Folly', 'Waiting', 'Conflict', 'The Army',

const hexName = n => (lang === 'fr' ? HEX_NAMES[n][1] : HEX_EN[n]);
const hexLabel = n => `${n}. ${HEX_NAMES[n][0]}, ${hexName(n)}`;

// ===== src/js/03-geometry.js =====
//: Géométrie du polygone (6 ou 7 côtés) et de la grille (modn, px, vertexAt, sideEnds, sideMid, sideAng)
const modn = (a, n) => ((a % n) + n) % n;
const px = g => M + g * S;
const vertexAt = deg => { const a = deg * Math.PI / 180; return [R * Math.cos(a), R * Math.sin(a)]; };
// côté k d'un polygone à n côtés : le côté 0 est en haut, puis sens horaire ; angle en degrés depuis le haut
const sideAng = (k, n) => 360 * k / n;
const sideEnds = (k, n) => [vertexAt(270 + sideAng(k, n) - 180 / n), vertexAt(270 + sideAng(k, n) + 180 / n)];
const sideMid = (k, n) => { const a = (270 + sideAng(k, n)) * Math.PI / 180; return [Math.cos(a), Math.sin(a)]; };

// ===== src/js/04-state.js =====
//: État global : les hexagrammes (slots, de 0 à 26), impulsions, horloge, options, impulsions, horloge, options
// ---------- État ----------
const bits = s => s.split('').map(Number);
const slots = [];
let slotSeq = 0;
// crée les données d'un hexagone (c : gx, gy, lines, et en option label, initial, mode, channel, active,
// custom, customOn, rot, rotOn, rotDir, rotSpeed). La lettre est la première libre.
// canal MIDI effectif : le canal unique s'il est choisi, sinon celui de l'hexagone (qui reste mémorisé)
const chanOf = slot => (opt.chanAll === null ? slot.channel : opt.chanAll);
function makeSlot(c) {
  const free = LABELS.split('').find(l => !slots.some(s => s.label === l));
  const label = c.label && !slots.some(s => s.label === c.label) ? c.label : free;
  const s = {
    id: slotSeq++, label, gx: c.gx, gy: c.gy, lines: c.lines.slice(), n: c.lines.length,   // n = 6 ou 7 côtés
    initial: (c.initial || c.lines).slice(),     // forme de départ, pour la réinitialisation
    mode: c.mode || 'chromatique', channel: c.channel === undefined ? LABELS.indexOf(label) % 16 : c.channel,
    tonic: c.tonic === undefined ? null : c.tonic, octave: c.octave || 0,   // tonique propre (null = globale), octave en plus
    active: c.active !== false,                  // inactif : grisé, ne joue pas, ne reçoit rien
    loopOn: !!c.loopOn, loopN: c.loopN || 24,    // amorce d'une note tous les loopN pas
    customOn: !!c.customOn,                      // notes personnalisées
    rot: c.rot || 0, rotOn: !!c.rotOn, rotDir: c.rotDir || 1, rotSpeed: c.rotSpeed || 1,
    rotAcc: 0, rotDelta: 0, rotT0: -1e9, rotDur: 1,
    ph: null, flash: Array(c.lines.length).fill(-99),
  };
  if (c.custom) s.custom = c.custom; else fillCustom(s);
  return s;
}

let pulses = [];
let tick = 0, running = false, tickMs = 240;
let lastTickAt = performance.now();
let timer = null, nextAt = 0;
const MAX_PULSES = 300;

const opt = {
  softRange: 2.5, mutate: false, tonic: 0, octave: 0,
  scale: 'chromatique',                       // gamme de base : celle des nouveaux hexagones
  chanAll: null,                              // canal MIDI unique pour tous (null = canaux individuels)
  uniform: false,                             // octave uniforme sur toute la grille
};

// ===== src/js/05-simulation.js =====
//: Simulation : notes, cibles, émission, réception, step, rotation, réinitialisation
// ---------- Simulation ----------
const pcOf = (k, line) => 2 * k + (line ? 0 : 1);
// décalage en demi-tons depuis la tonique pour le côté k, ou null si le côté est muet
// note par défaut du trait k selon la gamme (line = 1 plein, 0 brisé)
// Heptagone : une gamme de moins de 7 notes est complétée par les notes manquantes d'une gamme à 7 notes
// de même couleur (table HEPTA, ex. majeur pour la pentatonique majeure), au lieu de répéter des octaves.
const HEPTA = { pentamajeur: 'majeur', pentamineur: 'mineur', blues: 'mineur', tons: 'lydien', insen: 'phrygien', hirajoshi: 'mineur', augmentee: 'lydien' };
function scaleSteps(slot) {
  const steps = SCALES[slot.mode].steps;
  if (!steps || slot.n < 7 || steps.length >= 7 || !HEPTA[slot.mode]) return steps;
  return [...steps, ...SCALES[HEPTA[slot.mode]].steps.filter(x => !steps.includes(x))];
}
function defaultOffset(slot, k, line) {
  const steps = scaleSteps(slot);
  if (!steps) return pcOf(k, line);
  if (!line) return null;                       // gamme : trait brisé = pas de note, pas de renvoi
  return steps[k % steps.length] + 12 * Math.floor(k / steps.length);
}
// notes personnalisées : plein et brisé de chaque trait, de 0 à 23 demi-tons au-dessus de la tonique
// (null pour le brisé = silence)
// Gamme de plus de n notes : les notes qui n'ont pas de trait plein sont mises sur les premiers traits brisés,
// pour que toute la gamme soit présente (un brisé ne sonne que s'il est touché par une impulsion).
function fillCustom(slot) {
  const n = slot.n;
  slot.custom = Array.from({ length: n }, (_, k) => ({ p: defaultOffset(slot, k, 1), b: defaultOffset(slot, k, 0) }));
  const steps = SCALES[slot.mode].steps;
  for (let j = n; steps && j < steps.length; j++) slot.custom[j - n].b = steps[j];
}
// numéro d'hexagramme : les 6 premiers traits (le 7e côté, optionnel, n'en fait pas partie)
const hexOf = slot => hexNumber(slot.lines.slice(0, 6));
function offsetOf(slot, k) {
  const line = slot.lines[k];
  if (slot.customOn) return line ? slot.custom[k].p : slot.custom[k].b;
  return defaultOffset(slot, k, line);
}
const slotTonic = slot => (slot.tonic === null ? opt.tonic : slot.tonic);
// octave de la rangée : la grille est répartie sur 3 octaves (rangées du bas graves, du haut aiguës) ;
// avec l'option « octave uniforme », toutes les rangées sont à l'octave du milieu
const rowOctave = slot => (opt.uniform ? 1 : Math.floor((NY - 1 - slot.gy) * 3 / NY));
const midiOf = (slot, off) => Math.max(0, Math.min(127,
  48 + 12 * (rowOctave(slot) + opt.octave + slot.octave) + slotTonic(slot) + off));

// "to" est-il dans le secteur de `from` centré sur la direction ang (degrés depuis le haut, sens horaire) ?
// secteur demi-ouvert de largeur 360 / n, donc l'horizontale exacte d'un hexagone va au secteur du bas
function inSector(from, to, ang) {
  const cw = Math.atan2(to.gx - from.gx, -(to.gy - from.gy)) * 180 / Math.PI, w = 180 / from.n;
  return ((cw - ang + w + 1e-6 + 1080) % 360) < 2 * w;
}

function findTarget(from, ang) {
  let best = null, bd = Infinity;
  for (const o of slots) {
    if (o === from || !o.active) continue;
    if (!inSector(from, o, ang)) continue;
    const d = Math.hypot(o.gx - from.gx, o.gy - from.gy);
    if (d < bd) { bd = d; best = o; }
  }
  return best ? { slot: best, dist: bd } : null;
}

// émet une impulsion dans la direction ang (degrés depuis le haut, sens horaire)
function emit(from, ang, strong, range) {
  if (pulses.length >= MAX_PULSES) return;
  const hit = findTarget(from, ang), r = ang * Math.PI / 180;
  const x0 = from.gx, y0 = from.gy;
  if (!hit || hit.dist > range + 1e-9) {
    // impulsion perdue : petite étincelle qui s'éteint
    pulses.push({ x0, y0, x1: x0 + Math.sin(r) * .6, y1: y0 - Math.cos(r) * .6,
                  t0: tick, t1: tick + 1, target: null, ang, strong, range });
    return;
  }
  pulses.push({ x0, y0, x1: hit.slot.gx, y1: hit.slot.gy,
                t0: tick, t1: tick + Math.max(1, Math.ceil(hit.dist - 1e-9)),
                target: hit.slot, ang, strong, range: range - hit.dist });
}

function receive(p) {
  // côté physique touché s (celui qui regarde l'émetteur) ; le trait qui s'y trouve est li (le polygone peut avoir tourné)
  const slot = p.target, n = slot.n, s = Math.round(modn(p.ang + 180, 360) / (360 / n)) % n;
  const li = modn(s - slot.rot, n), line = slot.lines[li];
  if (line === 1) {
    slot.ph = { side: li, left: n };      // trait plein : rebond
  } else {
    emit(slot, p.ang, p.strong, p.range); // trait brisé : traversée
  }
  if (opt.mutate && (p.strong ? 1 : 0) !== line) {
    slot.lines[li] ^= 1;
    drawSlot(slot);
  }
}

function step() {
  tick++;
  lastTickAt = performance.now();

  // amorce périodique, par hexagone : relance le côté 0 tous les loopN pas
  for (const s of slots) if (s.active && s.loopOn && tick % s.loopN === 1) s.ph = { side: 0, left: s.n };

  const arriving = pulses.filter(p => p.t1 <= tick);
  pulses = pulses.filter(p => p.t1 > tick);
  for (const p of arriving) if (p.target && p.target.active) receive(p);

  for (const slot of slots) {
    if (!slot.ph || !slot.active) continue;
    const k = slot.ph.side, line = slot.lines[k], off = offsetOf(slot, k);
    if (off !== null) {
      const midi = midiOf(slot, off);
      playNote(midi, line ? 0.16 : 0.08, chanOf(slot));
      midiNote(slot, midi, line ? 96 : 56);
      recNote(slot, midi, line ? 96 : 56);
      slot.flash[k] = tick;
      emit(slot, sideAng(modn(k + slot.rot, slot.n), slot.n), line === 1, line ? Infinity : opt.softRange);
    }
    slot.ph.side = (k + 1) % slot.n;
    if (--slot.ph.left <= 0) slot.ph = null;
  }

  // rotation à la fin du pas : rotSpeed pas de 60° par pas d'horloge (fractionnaire = plus lent),
  // dans le sens rotDir (+1 horaire, -1 antihoraire)
  for (const slot of slots) {
    if (!slot.rotOn) continue;
    slot.rotAcc += slot.rotSpeed;
    const n = Math.floor(slot.rotAcc + 1e-6);
    if (n < 1) continue;
    slot.rotAcc -= n;
    slot.rotDelta = n * slot.rotDir;
    slot.rot += slot.rotDelta;
    slot.rotT0 = lastTickAt; slot.rotDur = tickMs;
  }
}

// rotation manuelle de 60° : d = +1 horaire, -1 antihoraire
function rotateBy(slot, d) {
  slot.rot += d; slot.rotDelta = d;
  slot.rotT0 = performance.now(); slot.rotDur = 160;
}

// remet un hexagramme à sa forme de départ
function resetSlot(slot) {
  slot.lines = slot.initial.slice();
  slot.rot = 0; slot.rotAcc = 0; slot.rotDelta = 0; slot.rotT0 = -1e9;
  slot.ph = null;
  slot.flash = Array(slot.n).fill(-99);
  pulses = pulses.filter(p => p.target !== slot);
  midiPanic();
  drawSlot(slot);
}

// définit un hexagramme par son numéro (devient aussi sa forme de départ)
function setHexagram(slot, n) {
  slot.lines.splice(0, 6, ...HEX_LINES[n]);      // un éventuel 7e côté est conservé
  slot.initial = slot.lines.slice();
  drawSlot(slot);
}

// ===== src/js/06-clock.js =====
//: Horloge : démarrer, arrêter, silence
// ---------- Horloge ----------
function schedule() {
  if (!running) return;
  const now = performance.now();
  if (nextAt < now - 4 * tickMs) nextAt = now;   // rattrapage après onglet en veille
  step();
  nextAt += tickMs;
  timer = setTimeout(schedule, Math.max(0, nextAt - performance.now()));
}
function start() {
  ensureAudio();
  if (running) return;
  running = true; nextAt = performance.now();
  $play.textContent = t('pause'); $play.classList.add('on');
  sendPrograms();                            // les instruments sont renvoyés à chaque départ
  if (arec) arec.started = true;            // l'audio commence au premier Jouer
  schedule();
}
function stop() {
  running = false; clearTimeout(timer);
  $play.textContent = t('play'); $play.classList.remove('on');
  midiPanic();
}
function silence() {
  pulses = [];
  for (const s of slots) s.ph = null;
  midiPanic();
}

// ===== src/js/07-midi-file.js =====
//: Enregistrement et export en fichier MIDI (.mid) et téléchargement
// ---------- Enregistrement MIDI ----------
// Un pas de la simulation = une croche. Les événements sont stockés par numéro de pas
// (pas de gigue d'horloge), puis convertis en ticks MIDI à l'export.
const PPQ = 480, STEP_TICKS = PPQ / 2, NOTE_TICKS = Math.round(STEP_TICKS * 0.9);
let rec = null;

function beginRecording() {
  rec = { events: [], tempos: [{ step: tick, ms: tickMs }], live: true };
}
function recNote(slot, midi, vel) {
  if (rec && rec.live) rec.events.push({ step: tick, slot: slot.id, ch: chanOf(slot), midi, vel });
}
function recTempo() {
  if (rec && rec.live) rec.tempos.push({ step: tick, ms: tickMs });
}

const vlq = n => { const b = [n & 0x7f]; while ((n >>= 7) > 0) b.unshift((n & 0x7f) | 0x80); return b; };
const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
const u16 = n => [(n >> 8) & 255, n & 255];
const ascii = s => Array.from(new TextEncoder().encode(s));
const chunk = (id, bytes) => [...ascii(id), ...u32(bytes.length), ...bytes];
const metaText = (type, s) => { const t = ascii(s); return [0xff, type, ...vlq(t.length), ...t]; };

function trackChunk(events) {
  events.sort((a, b) => a.t - b.t || a.order - b.order);
  const out = [];
  let last = 0;
  for (const e of events) { out.push(...vlq(e.t - last), ...e.bytes); last = e.t; }
  out.push(0x00, 0xff, 0x2f, 0x00);
  return chunk('MTrk', out);
}

function buildMidi(r) {
  const base = Math.min(...r.events.map(e => e.step));   // on supprime le silence de tête

  // piste 0 : tempo (un pas = une croche, donc 1 noire = 2 pas)
  const tempoTrack = [{ t: 0, order: 0, bytes: metaText(0x03, 'Hexacorde') },
                      { t: 0, order: 1, bytes: [0xff, 0x58, 0x04, 4, 2, 24, 8] }];
  const initial = r.tempos.filter(x => x.step <= base).pop() || r.tempos[0];
  const usq = ms => { const v = Math.round(ms * 2000); return [0xff, 0x51, 0x03, (v >> 16) & 255, (v >> 8) & 255, v & 255]; };
  tempoTrack.push({ t: 0, order: 2, bytes: usq(initial.ms) });
  for (const x of r.tempos) if (x.step > base) tempoTrack.push({ t: (x.step - base) * STEP_TICKS, order: 2, bytes: usq(x.ms) });

  // une piste par hexagone, avec le canal choisi pour cet hexagone
  const tracks = [trackChunk(tempoTrack)];
  for (const slot of slots) {
    const mine = r.events.filter(e => e.slot === slot.id);
    if (!mine.length) continue;
    const ev = [{ t: 0, order: 0, bytes: metaText(0x03, `Hexacorde ${slot.label} ${slot.mode}`) }];
    const pc = prog[mine[0].ch];             // instrument du canal au moment de l'export
    if (pc !== null) ev.push({ t: 0, order: 0, bytes: [0xc0 | mine[0].ch, pc] });
    for (const e of mine) {
      const t = (e.step - base) * STEP_TICKS;
      ev.push({ t, order: 1, bytes: [0x90 | e.ch, e.midi, e.vel] });
      ev.push({ t: t + NOTE_TICKS, order: 0, bytes: [0x80 | e.ch, e.midi, 0] });
    }
    tracks.push(trackChunk(ev));
  }
  const header = chunk('MThd', [...u16(1), ...u16(tracks.length), ...u16(PPQ)]);
  return Uint8Array.from([header, ...tracks].flat());
}

function download(bytes, filename, mime = 'audio/midi') {
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// horodatage pour les noms de fichier : AAAAMMJJ-HHMMSS
function fileStamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
const fileBase = () => ($recName.value.trim() || 'hexacorde').replace(/[^\p{L}\p{N}_. -]+/gu, '_');

// arrête l'enregistrement MIDI et télécharge le fichier ; renvoie false s'il n'y avait aucune note
function finishRecording() {
  const r = rec;
  if (!r || !r.events.length) return false;
  rec = null;
  download(buildMidi(r), `${fileBase()}-${fileStamp()}.mid`);
  return true;
}

// ===== src/js/08-midi-out.js =====
//: Sortie MIDI en direct (Web MIDI) : midiNote, midiPanic
// ---------- Sortie MIDI en direct (Web MIDI) ----------
let midiAccess = null, midiOut = null;

function midiNote(slot, midi, vel) {
  if (!midiOut) return;
  const ch = chanOf(slot);
  try {
    midiOut.send([0x90 | ch, midi, vel]);
    // le note off est planifié par le navigateur : 90 % d'un pas plus tard
    midiOut.send([0x80 | ch, midi, 0], performance.now() + tickMs * 0.9);
  } catch (_) { /* port fermé */ }
}
// all notes off sur les 16 canaux
function midiPanic() {
  if (!midiOut) return;
  try { for (let ch = 0; ch < 16; ch++) midiOut.send([0xb0 | ch, 123, 0]); } catch (_) { /* port fermé */ }
}

// instruments (program change) par canal : prog[ch] = 0..127 ou null (rien n'est envoyé)
const prog = Array(16).fill(null);
function sendPrograms() {
  if (!midiOut) return;
  try { prog.forEach((p, ch) => { if (p !== null) midiOut.send([0xc0 | ch, p]); }); } catch (_) { /* port fermé */ }
}

// ===== src/js/09-audio.js =====
//: Son interne : oscillateur carré (WebAudio)
// ---------- Son : carré ----------
let ac = null, master = null, voices = 0;
function ensureAudio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = +$vol.value;
    master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
}
// onde, enveloppe ADSR (A, D, R en ms, S = niveau de 0 à 1) et filtre (une instance par note)
// fenv : profondeur de l'enveloppe de filtre (0 à 1, jusqu'à 4 octaves au-dessus de la coupure)
// fmr, fmi : rapport de fréquence et indice de modulation, utilisés seulement par l'onde 'fm'
const snd = { wave: 'square', a: 5, d: 250, s: 0.1, r: 150, ftype: 'lowpass', fcut: 3200, fq: 0.7, fenv: 0, fmr: 2, fmi: 3 };
// sons propres à un canal MIDI (null = le son de base `snd`) : chaque canal peut avoir son instrument interne
const chanSnd = Array(16).fill(null);
const soundOf = ch => chanSnd[ch] || snd;
// instruments prêts à l'emploi (noms : preset.<clé> dans les dictionnaires)
const SOUND_PRESETS = {
  lead:  { wave: 'square',   a: 5,   d: 250,  s: 0.1,  r: 150,  ftype: 'lowpass',  fcut: 3200, fq: 0.7, fenv: 0 },
  soft:  { wave: 'sine',     a: 20,  d: 400,  s: 0.5,  r: 300,  ftype: 'lowpass',  fcut: 8000, fq: 0.7, fenv: 0 },
  bass:  { wave: 'sawtooth', a: 3,   d: 200,  s: 0.3,  r: 100,  ftype: 'lowpass',  fcut: 600,  fq: 2,   fenv: 0.5 },
  pluck: { wave: 'triangle', a: 1,   d: 180,  s: 0,    r: 120,  ftype: 'lowpass',  fcut: 4000, fq: 1,   fenv: 0.4 },
  pad:   { wave: 'sawtooth', a: 400, d: 800,  s: 0.7,  r: 1200, ftype: 'lowpass',  fcut: 1800, fq: 0.7, fenv: 0.3 },
  bell:  { wave: 'triangle', a: 1,   d: 900,  s: 0.05, r: 900,  ftype: 'lowpass',  fcut: 9000, fq: 3,   fenv: 0 },
  organ: { wave: 'square',   a: 8,   d: 50,   s: 0.9,  r: 80,   ftype: 'lowpass',  fcut: 2500, fq: 0.7, fenv: 0 },
  brass: { wave: 'sawtooth', a: 60,  d: 250,  s: 0.6,  r: 150,  ftype: 'lowpass',  fcut: 1500, fq: 1,   fenv: 0.6 },
  // sons FM à 2 opérateurs : la porteuse (sinus) est modulée en fréquence par un sinus de fréquence ratio x f
  fmbell:  { wave: 'fm', a: 1,   d: 1200, s: 0,    r: 1000, ftype: 'lowpass', fcut: 12000, fq: 0.7, fenv: 0, fmr: 3.5, fmi: 4 },
  fmep:    { wave: 'fm', a: 2,   d: 700,  s: 0.15, r: 300,  ftype: 'lowpass', fcut: 9000,  fq: 0.7, fenv: 0, fmr: 1,   fmi: 2 },
  fmbass:  { wave: 'fm', a: 2,   d: 250,  s: 0.4,  r: 120,  ftype: 'lowpass', fcut: 3000,  fq: 0.7, fenv: 0, fmr: 1,   fmi: 3.5 },
  fmbrass: { wave: 'fm', a: 40,  d: 300,  s: 0.6,  r: 180,  ftype: 'lowpass', fcut: 8000,  fq: 0.7, fenv: 0, fmr: 1,   fmi: 5 },
  fmmarimba: { wave: 'fm', a: 1, d: 300,  s: 0,    r: 200,  ftype: 'lowpass', fcut: 9000,  fq: 0.7, fenv: 0, fmr: 4,   fmi: 2 },
  fmpad:   { wave: 'fm', a: 350, d: 700,  s: 0.8,  r: 1000, ftype: 'lowpass', fcut: 6000,  fq: 0.7, fenv: 0, fmr: 2,   fmi: 1.5 },
};
const WAVE_GAIN = { square: 1, sawtooth: 0.8, triangle: 1.4, sine: 1.4, fm: 1.1 };   // volumes à peu près égaux
const FILTERS = { lowpass: 1, highpass: 1, bandpass: 1, notch: 1 };      // noms : clés filter.<type>
// attaque vers `peak`, déclin vers `sus`, tenue jusqu'à `tg`, relâchement vers `end`
// (le niveau à tg est calculé : cancelAndHoldAtTime n'existe pas dans Firefox)
function adsr(param, t, A, D, R, tg, start, peak, sus, end) {
  param.setValueAtTime(start, t);
  param.linearRampToValueAtTime(peak, t + A);
  param.setTargetAtTime(sus, t + A, D / 3);
  param.setValueAtTime(sus + (peak - sus) * Math.exp(-(tg - t - A) / (D / 3)), tg);
  param.setTargetAtTime(end, tg, R / 3);
}
// ch : canal MIDI effectif de l'hexagone, qui donne le son (propre au canal, ou de base)
function playNote(midi, gain, ch) {
  const s = soundOf(ch);
  if (!ac || voices > 32 || !$internal.checked) return;
  const gate = Math.max(0.05, tickMs / 1000 * 0.9);          // même durée que la note MIDI
  const A = Math.min(s.a / 1000, gate), D = s.d / 1000, R = s.r / 1000;
  const peak = gain * WAVE_GAIN[s.wave];
  const t = ac.currentTime, tg = t + gate;
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  const freq = 440 * Math.pow(2, (midi - 69) / 12);
  o.type = s.wave === 'fm' ? 'sine' : s.wave;
  o.frequency.value = freq;
  if (s.wave === 'fm') {                    // modulateur : sa profondeur suit l'enveloppe, donc attaque brillante puis son plus doux
    const m = ac.createOscillator(), mg = ac.createGain(), depth = freq * s.fmr * s.fmi;
    m.frequency.value = freq * s.fmr;
    adsr(mg.gain, t, A, D, R, tg, 0, depth, depth * s.s, 0);
    m.connect(mg); mg.connect(o.frequency);
    m.start(t); m.stop(tg + R + 0.05);
  }
  f.type = s.ftype; f.Q.value = s.fq;
  const top = Math.min(18000, s.fcut * Math.pow(2, 4 * s.fenv));
  const mid = Math.min(18000, s.fcut * Math.pow(2, 4 * s.fenv * s.s));
  f.frequency.value = s.fcut;
  if (s.fenv > 0) adsr(f.frequency, t, A, D, R, tg, s.fcut, top, mid, s.fcut);
  adsr(g.gain, t, A, D, R, tg, 0, peak, peak * s.s, 0);
  o.connect(f); f.connect(g); g.connect(master);
  voices++;
  o.onended = () => { voices--; g.disconnect(); };
  o.start(t); o.stop(tg + R + 0.05);
}

// ===== src/js/10-board.js =====
//: Plateau SVG : grille, dessin d'un hexagone (drawSlot), rotation visuelle
// ---------- Dessin ----------
const svg = document.getElementById('board');
const el = (name, attrs = {}, parent) => {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};

// points de la grille ; la taille du plateau suit NX et NY
const gridLayer = el('g', {}, svg);
function drawGrid() {
  svg.setAttribute('viewBox', `0 0 ${2 * M + (NX - 1) * S} ${2 * M + (NY - 1) * S}`);
  svg.setAttribute('aria-label', t('grid.aria', NX, NY));
  while (gridLayer.firstChild) gridLayer.removeChild(gridLayer.firstChild);
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++)
    el('circle', { cx: px(x), cy: px(y), r: 2.5, fill: 'var(--grid)' }, gridLayer);
}
drawGrid();
const slotLayer = el('g', {}, svg);
const pulseLayer = el('g', { 'pointer-events': 'none' }, svg);

// crée le groupe SVG d'un hexagone (appelé à la création de l'hexagone)
function buildSlotView(slot) {
  slot.g = el('g', { cursor: 'grab' }, slotLayer);
  // clic droit : menu (rotation, notes). Molette : bas = rotation horaire, haut = antihoraire
  slot.g.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    if (slot.sel && slots.filter(s => s.sel).length > 1) openSelMenu(e.clientX, e.clientY);   // sélection multiple
    else openMenu(slot, e.clientX, e.clientY);
  });
  let lastWheel = 0;
  slot.g.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.timeStamp - lastWheel < 120) return;
    lastWheel = e.timeStamp;
    rotateBy(slot, e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  drawSlot(slot);
}

function drawSlot(slot) {
  const g = slot.g;
  g.setAttribute('opacity', slot.active ? 1 : 0.3);      // inactif : grisé
  while (g.firstChild) g.removeChild(g.firstChild);
  g.setAttribute('transform', `translate(${px(slot.gx)},${px(slot.gy)})`);

  const n = slot.n;
  const pts = Array.from({ length: n }, (_, k) => vertexAt(270 + sideAng(k, n) - 180 / n).join(',')).join(' ');
  const body = el('polygon', { points: pts, fill: 'var(--body)', stroke: slot.sel ? 'var(--yang)' : 'var(--edge)', 'stroke-width': slot.sel ? 2.5 : 1 }, g);
  body.addEventListener('pointerdown', e => beginDrag(e, slot));

  el('text', { x: 0, y: 0, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
               'font-size': 15, fill: 'var(--glyph)', 'font-weight': 700, 'pointer-events': 'none' }, g)
    .textContent = slot.label;
  el('text', { x: 0, y: 13, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
               'font-size': 7, fill: 'var(--glyph)', 'pointer-events': 'none' }, g)
    .textContent = scaleShort(slot.mode);

  // numéro et nom de l'hexagramme sous l'hexagone
  const hn = hexOf(slot);
  el('text', { x: 0, y: R + 11, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
               'font-size': 8.5, fill: 'var(--dim)', 'pointer-events': 'none' }, g)
    .textContent = `${hn} ${HEX_NAMES[hn][0]}${n === 7 ? ' +1' : ''}`;
  if (slot.hexSel) slot.hexSel.value = hn;

  slot.sideEls = []; slot.labelEls = [];
  slot.rotG = el('g', {}, g);               // traits : tournent avec l'hexagone
  for (let k = 0; k < n; k++) {
    const [a, b] = sideEnds(k, n);
    const inset = 0.12;
    const lerp = (u, v, t) => [u[0] + (v[0] - u[0]) * t, u[1] + (v[1] - u[1]) * t];
    const segs = slot.lines[k]
      ? [[lerp(a, b, inset), lerp(a, b, 1 - inset)]]
      : [[lerp(a, b, inset), lerp(a, b, 0.42)], [lerp(a, b, 0.58), lerp(a, b, 1 - inset)]];
    const sg = el('g', {}, slot.rotG);
    const els = segs.map(([p, q]) => el('line', {
      x1: p[0], y1: p[1], x2: q[0], y2: q[1],
      stroke: 'var(--ink)', 'stroke-width': 5, 'stroke-linecap': 'round',
    }, sg));
    // zone cliquable pour basculer le trait
    const hit = el('line', {
      x1: a[0], y1: a[1], x2: b[0], y2: b[1],
      stroke: 'transparent', 'stroke-width': 14, cursor: 'pointer',
    }, sg);
    // glisser sur un trait fait tourner l'hexagone ; un simple clic bascule le trait
    hit.addEventListener('pointerdown', e => { e.stopPropagation(); beginSpin(e, slot); });
    hit.addEventListener('click', () => {
      if (slot.noClick) return;
      slot.lines[k] ^= 1; drawSlot(slot);
    });
    slot.sideEls.push(els);

    const m = sideMid(k, n);
    const t = el('text', {
      x: m[0] * R * 0.58, y: m[1] * R * 0.58,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 8.5, fill: 'var(--dim)', 'pointer-events': 'none',
    }, g);
    const off = offsetOf(slot, k);
    t.textContent = off === null ? '·' : NAMES[(slotTonic(slot) + off) % 12] + (off >= 12 ? "'" : '');
    slot.labelEls.push(t);
  }
  applyRotation(slot, 360 / n * slot.rot);
}

// fait tourner les traits de deg degrés ; les étiquettes suivent mais restent droites
function applyRotation(slot, deg) {
  slot.rotG.setAttribute('transform', `rotate(${deg})`);
  for (let k = 0; k < slot.n; k++) {
    const a = (270 + sideAng(k, slot.n) + deg) * Math.PI / 180;
    slot.labelEls[k].setAttribute('x', Math.cos(a) * R * 0.58);
    slot.labelEls[k].setAttribute('y', Math.sin(a) * R * 0.58);
  }
}

// ===== src/js/11-drag.js =====
//: Interaction : glisser-déposer et clic sur un hexagone
// glisser / cliquer
let drag = null;
function svgPoint(e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function beginDrag(e, slot) {
  if (e.button !== 0) return;            // clic droit : voir contextmenu
  e.preventDefault();
  const p = svgPoint(e);
  drag = { slot, ox: p.x - px(slot.gx), oy: p.y - px(slot.gy), moved: false, sx: e.clientX, sy: e.clientY };
  try { slot.g.setPointerCapture(e.pointerId); } catch (_) { /* pointeur non capturable */ }
  slot.g.setAttribute('cursor', 'grabbing');
  slot.g.addEventListener('pointermove', onMove);
  slot.g.addEventListener('pointerup', onUp);
  slot.g.addEventListener('pointercancel', onUp);
}
function onMove(e) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
  drag.moved = true;
  const p = svgPoint(e);
  drag.slot.g.setAttribute('transform', `translate(${p.x - drag.ox},${p.y - drag.oy})`);
}
function onUp(e) {
  if (!drag) return;
  const { slot, moved } = drag;
  slot.g.removeEventListener('pointermove', onMove);
  slot.g.removeEventListener('pointerup', onUp);
  slot.g.removeEventListener('pointercancel', onUp);
  slot.g.setAttribute('cursor', 'grab');
  drag = null;
  if (moved && e.type === 'pointerup') {
    const p = svgPoint(e);
    const gx = Math.max(0, Math.min(NX - 1, Math.round((p.x - M) / S)));
    const gy = Math.max(0, Math.min(NY - 1, Math.round((p.y - M) / S)));
    if (!slots.some(o => o !== slot && o.gx === gx && o.gy === gy)) { slot.gx = gx; slot.gy = gy; }
    drawSlot(slot);
  } else if (!moved) {
    if (!slot.active) return;
    slot.ph = { side: 0, left: slot.n };
    start();
  }
}

// rotation à la souris : on saisit un trait et on tourne autour du centre de l'hexagone,
// un cran (360 / n degrés) chaque fois que le pointeur a parcouru un cran (dans un sens ou dans l'autre)
function beginSpin(e, slot) {
  if (e.button !== 0) return;
  const r = slot.g.querySelector('polygon').getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const ang = ev => Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI;
  const sx = e.clientX, sy = e.clientY;
  let prev = ang(e), total = 0, applied = 0, moved = false;
  const move = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
    moved = true;
    let d = ang(ev) - prev;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    prev = ang(ev); total += d;
    const n = Math.round(total / (360 / slot.n));
    if (n !== applied) { rotateBy(slot, n - applied); applied = n; }
  };
  const up = () => {
    removeEventListener('pointermove', move);
    removeEventListener('pointerup', up);
    removeEventListener('pointercancel', up);
    if (moved) { slot.noClick = true; setTimeout(() => { slot.noClick = false; }, 60); }   // pas de basculement du trait
  };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
}

// sélection multiple : on tire un rectangle sur le fond de la grille (Maj : ajoute à la sélection) ;
// un clic sur le fond désélectionne. Clic droit sur la sélection : menu (supprimer, désactiver...).
const selLayer = el('g', { 'pointer-events': 'none' }, svg);
const selected = () => slots.filter(s => s.sel);
function setSel(slot, on) { if (!!slot.sel !== on) { slot.sel = on; drawSlot(slot); } }
function clearSel() { slots.forEach(s => setSel(s, false)); }
svg.addEventListener('pointerdown', e => {
  if (e.button !== 0 || slotLayer.contains(e.target)) return;
  const p0 = svgPoint(e), sx = e.clientX, sy = e.clientY, add = e.shiftKey;
  let rect = null;
  const move = ev => {
    if (!rect && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
    const p = svgPoint(ev);
    if (!rect) rect = el('rect', { fill: 'var(--yang)', 'fill-opacity': 0.08, stroke: 'var(--yang)', 'stroke-dasharray': '4 3' }, selLayer);
    rect.setAttribute('x', Math.min(p0.x, p.x)); rect.setAttribute('y', Math.min(p0.y, p.y));
    rect.setAttribute('width', Math.abs(p.x - p0.x)); rect.setAttribute('height', Math.abs(p.y - p0.y));
  };
  const up = ev => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    if (rect) {
      const p = svgPoint(ev), x0 = Math.min(p0.x, p.x), x1 = Math.max(p0.x, p.x), y0 = Math.min(p0.y, p.y), y1 = Math.max(p0.y, p.y);
      rect.remove();
      for (const s of slots) {
        const inside = px(s.gx) >= x0 && px(s.gx) <= x1 && px(s.gy) >= y0 && px(s.gy) <= y1;
        if (inside) setSel(s, true); else if (!add) setSel(s, false);
      }
    } else if (!add) clearSel();
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
});
function deleteSelected() {
  for (const s of selected()) removeSlot(s, true);
  midiPanic(); closeMenu();
}
document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === 'Delete' && selected().length) deleteSelected();
  if (e.key === 'Escape') clearSel();
});

// ===== src/js/12-frame.js =====
//: Animation : impulsions, éclats, rotation animée, état affiché
// animation : impulsions et éclats
const pulseEls = new Map();
function frame(now) {
  const tf = tick + (running ? Math.min(1, (now - lastTickAt) / tickMs) : 0);

  const seen = new Set();
  for (const p of pulses) {
    let c = pulseEls.get(p);
    if (!c) { c = el('circle', {}, pulseLayer); pulseEls.set(p, c); }
    seen.add(p);
    const u = Math.max(0, Math.min(1, (tf - p.t0) / (p.t1 - p.t0)));
    c.setAttribute('cx', px(p.x0 + (p.x1 - p.x0) * u));
    c.setAttribute('cy', px(p.y0 + (p.y1 - p.y0) * u));
    c.setAttribute('r', p.strong ? 6 : 4);
    c.setAttribute('fill', p.strong ? 'var(--yang)' : 'var(--yin)');
    c.setAttribute('opacity', p.target ? 1 : 1 - u);
  }
  for (const [p, c] of pulseEls) if (!seen.has(p)) { c.remove(); pulseEls.delete(p); }

  for (const slot of slots) {
    // rotation animée (un pas d'horloge pour la rotation auto, 160 ms pour la manuelle)
    const u = Math.min(1, Math.max(0, (now - slot.rotT0) / slot.rotDur));
    applyRotation(slot, 360 / slot.n * (slot.rot - slot.rotDelta * (1 - u * u * (3 - 2 * u))));
    for (let k = 0; k < slot.n; k++) {
      const f = Math.max(0, 1 - (tf - slot.flash[k]) / 2.5);
      const color = f > 0 ? (slot.lines[k] ? 'var(--yang)' : 'var(--yin)') : 'var(--ink)';
      for (const l of slot.sideEls[k]) {
        l.setAttribute('stroke', color);
        l.setAttribute('stroke-width', 5 + 3 * f);
        l.setAttribute('opacity', 0.55 + 0.45 * Math.max(f, 0.0));
      }
      slot.labelEls[k].setAttribute('fill', f > 0 ? 'var(--ink)' : 'var(--dim)');
    }
  }
  $status.textContent = t('status', tick, pulses.length) +
    (rec ? t('status.midi', rec.events.length) + (rec.live ? '' : t('status.stopped')) : '') +
    (arec ? t('status.audio', (arec.n / ac.sampleRate).toFixed(1)) + (arec.live ? '' : t('status.stopped')) : '');
  $recSave.disabled = !(rec && rec.events.length);
  $arecSave.disabled = !(arec && arec.n);
  requestAnimationFrame(frame);
}

// premier point libre le plus proche de (gx, gy), ou null si la grille est pleine
function freeCellNear(gx, gy) {
  let best = null, bd = Infinity;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    if (slots.some(s => s.gx === x && s.gy === y)) continue;
    const d = Math.hypot(x - gx, y - gy);
    if (d < bd) { bd = d; best = [x, y]; }
  }
  return best;
}

  NX = cols; NY = rows;

  return true;
}

//: Setup : sauvegarde et chargement (mémoire, fichier, texte)
// ---------- Setup : sauvegarde et chargement ----------
const $setupText = $('setupText'), $setupMsg = $('setupMsg'), $setupList = $('setupList'), $setupName = $('setupName');
const STORE_KEY = 'hexacorde.setups';

// date et heure locales : `iso` (ISO 8601 avec fuseau) pour le contenu, `name` pour le nom de fichier
// (pas de « : » dans un nom de fichier)
function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const off = -d.getTimezoneOffset(), sg = off >= 0 ? '+' : '-';
  const day = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  const hms = [d.getHours(), d.getMinutes(), d.getSeconds()].map(p);
  return {
    iso: `${day}T${hms.join(':')}${sg}${p(Math.floor(Math.abs(off) / 60))}:${p(Math.abs(off) % 60)}`,
    name: `hexacorde_${day}_${hms.join('-')}`,
  };
}
// le champ Nom est pré-rempli avec la date et l'heure tant qu'on n'y a pas écrit soi-même ;
// il est rafraîchi à chaque sauvegarde pour que l'heure soit celle de la sauvegarde
let autoName = true;
function refreshName() { if (autoName) $setupName.value = stamp().name; }
$setupName.addEventListener('input', () => { autoName = false; });
refreshName();
const speedCode = v => (SPEEDS.find(x => Math.abs(x[0] - v) < 1e-6) || SPEEDS[4])[2];

const soundToJson = x => ({ onde: x.wave, a: x.a, d: x.d, s: x.s, r: x.r, filtre: x.ftype, coupure: x.fcut, q: x.fq, env: x.fenv,
  ...(x.wave === 'fm' ? { fm: x.fmr, indice: x.fmi } : {}) });
// son lu dans un setup : chaque champ est facultatif (valeur de def sinon) et borné
function parseSound(so, def) {
  const num = (v, lo, hi, d) => (Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d);
  so = so || {};
  return {
    wave: WAVE_GAIN[so.onde] ? so.onde : def.wave,
    a: Math.round(num(so.a, 1, 500, def.a)), d: Math.round(num(so.d, 10, 1000, def.d)),
    s: num(so.s, 0, 1, def.s), r: Math.round(num(so.r, 10, 1500, def.r)),
    ftype: FILTERS[so.filtre] ? so.filtre : def.ftype, fcut: Math.round(num(so.coupure, 30, 16000, def.fcut)),
    fq: num(so.q, 0.1, 20, def.fq), fenv: num(so.env, 0, 1, def.fenv),
    fmr: num(so.fm, 0.5, 12, def.fmr), fmi: num(so.indice, 0, 12, def.fmi),
  };
}

function getSetup() {
  return {
    hexacorde: 1,
    date: stamp().iso,
    grille: [NX, NY], gamme: opt.scale, canalUnique: opt.chanAll === null ? undefined : opt.chanAll + 1, uniforme: opt.uniform || undefined, pas: tickMs, tonique: opt.tonic, octave: opt.octave, portee: opt.softRange, mutation: opt.mutate,
    son: soundToJson(snd),
    // sons propres à un canal (numéro de canal 1 à 16) : seulement ceux qui existent
    ...(chanSnd.some(Boolean) ? { sons: Object.fromEntries(chanSnd.map((x, i) => [i + 1, x]).filter(([, x]) => x).map(([i, x]) => [i, soundToJson(x)])) } : {}),
    ...(prog.some(p => p !== null) ? { programmes: Object.fromEntries(prog.map((p, i) => [i + 1, p]).filter(([, p]) => p !== null)) } : {}),
    hexagrammes: slots.map(s => ({
      lettre: s.label, pos: [s.gx, s.gy], traits: s.lines.join(''), depart: s.initial.join(''),
      gamme: s.mode, canal: s.channel + 1,
      rotation: { active: s.rotOn, sens: s.rotDir > 0 ? 'horaire' : 'antihoraire',
                  vitesse: speedCode(s.rotSpeed), angle: modn(s.rot, s.n) * 60 },
      ...(s.active ? {} : { actif: false }),
      ...(s.tonic === null ? {} : { tonique: s.tonic }), ...(s.octave ? { octave: s.octave } : {}),
      ...(s.loopOn ? { amorce: s.loopN } : {}),
      // les notes personnalisées ne sont écrites que si elles sont actives (sinon la gamme suffit)
      ...(s.customOn ? { notes: { active: true, plein: s.custom.map(c => c.p), brise: s.custom.map(c => c.b) } } : {}),
    })),
  };
}
// JSON lisible : un hexagramme par ligne
function setupToText(d) {
  const { hexagrammes, ...head } = d;
  const h = JSON.stringify(head).slice(1, -1);
  return `{${h},\n"hexagrammes": [\n${hexagrammes.map(x => '  ' + JSON.stringify(x)).join(',\n')}\n]}`;
}

// vérifie tout avant de toucher à l'état ; renvoie { error } ou { cfg }
function parseSetup(text) {
  let d;
  try { d = JSON.parse(text); }
  catch (_) {
    const a = text.indexOf('{'), b = text.lastIndexOf('}');
    try { d = JSON.parse(text.slice(a, b + 1)); } catch (e2) { return { error: t('err.json') }; }
  }
  if (!d || d.hexacorde !== 1 || !Array.isArray(d.hexagrammes)) return { error: t('err.notsetup') };
  const num = (v, lo, hi, def) => (Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : def);
  const gr = Array.isArray(d.grille) ? d.grille : [d.grille, d.grille];     // un nombre = grille carrée
  const cols = Math.round(num(gr[0], N_MIN, N_MAX, 6)), rows = Math.round(num(gr[1], N_MIN, N_MAX, 6));
  if (d.hexagrammes.length > LABELS.length) return { error: t('err.max', LABELS.length) };
  const used = new Set(), list = [], labels = new Set();
  for (const [i, x] of d.hexagrammes.entries()) {
    const L = typeof x.lettre === 'string' && x.lettre.length === 1 && LABELS.includes(x.lettre) && !labels.has(x.lettre) ? x.lettre : '#' + (i + 1);
    const label = L[0] === '#' ? undefined : L;
    if (label) labels.add(label);
    const pos = x.pos;
    if (!Array.isArray(pos) || !Number.isInteger(pos[0]) || !Number.isInteger(pos[1]) || pos.length !== 2 || pos[0] < 0 || pos[0] >= cols || pos[1] < 0 || pos[1] >= rows)
      return { error: t('err.pos', L, cols - 1, rows - 1) };
    if (used.has(pos.join())) return { error: t('err.occupied', L) };
    used.add(pos.join());
    let lines = null;
    if (typeof x.traits === 'string' && /^[01]{6,7}$/.test(x.traits)) lines = bits(x.traits);
    else if (Number.isInteger(x.numero) && HEX_LINES[x.numero]) lines = HEX_LINES[x.numero].slice();
    if (!lines) return { error: t('err.lines', L) };
    const initial = typeof x.depart === 'string' && /^[01]{6,7}$/.test(x.depart) && x.depart.length === lines.length ? bits(x.depart) : lines.slice();
    const mode = x.gamme === undefined ? 'chromatique' : x.gamme;
    if (!SCALES[mode]) return { error: t('err.scale', L, x.gamme) };
    const canal = x.canal === undefined ? (label ? LABELS.indexOf(label) : i) % 16 + 1 : x.canal;
    if (!Number.isInteger(canal) || canal < 1 || canal > 16) return { error: t('err.chan', L) };
    const r = x.rotation || {};
    const sp = SPEEDS.find(v => v[2] === (r.vitesse === undefined ? 'x1' : r.vitesse));
    if (!sp) return { error: t('err.speed', L, r.vitesse) };
    const angle = r.angle === undefined ? 0 : r.angle;
    if (!Number.isInteger(angle) || angle % 60) return { error: t('err.angle', L) };
    let custom = null, customOn = false;
    if (x.notes !== undefined) {
      const n = x.notes || {};
      const six = a => Array.isArray(a) && a.length === lines.length;
      const inRange = v => Number.isInteger(v) && v >= 0 && v < 24;   // null = silence
      if (!six(n.plein) || !n.plein.every(v => v === null || inRange(v)) || !six(n.brise) || !n.brise.every(v => v === null || inRange(v)))
        return { error: t('err.notes', L) };
      custom = n.plein.map((p, k) => ({ p, b: n.brise[k] }));
      customOn = !!n.active;
    }
    // amorce : par hexagone ; l'ancien format avait un seul réglage global, pour le premier hexagone
    const tonic = Number.isInteger(x.tonique) && x.tonique >= 0 && x.tonique < 12 ? x.tonique : null;
    const oct = Number.isInteger(x.octave) ? Math.max(-3, Math.min(3, x.octave)) : 0;
    const am = x.amorce !== undefined ? x.amorce : (i === 0 ? d.amorce : 0);
    const loopOn = Number.isFinite(am) && am >= 2;
    list.push({ label, gx: pos[0], gy: pos[1], lines, initial, mode, channel: canal - 1, custom, customOn,
                active: x.actif !== false, tonic, octave: oct, loopOn, loopN: loopOn ? Math.min(128, Math.round(am)) : 24,
                rotOn: !!r.active, rotDir: r.sens === 'antihoraire' ? -1 : 1, rotSpeed: sp[0], rot: modn(angle / 60, lines.length) });
  }
  const son = parseSound(d.son, SND_DEFAULT);
  const sons = {};
  for (const [k, v] of Object.entries(d.sons && typeof d.sons === 'object' ? d.sons : {}))
    if (Number.isInteger(+k) && +k >= 1 && +k <= 16) sons[+k - 1] = parseSound(v, son);
  const programmes = {};
  for (const [k, v] of Object.entries(d.programmes && typeof d.programmes === 'object' ? d.programmes : {}))
    if (Number.isInteger(+k) && +k >= 1 && +k <= 16 && Number.isInteger(v) && v >= 0 && v <= 127) programmes[+k - 1] = v;
  return { cfg: {
    slots: list, son, sons, programmes, cols, rows, gamme: SCALES[d.gamme] ? d.gamme : 'chromatique', uniforme: !!d.uniforme,
    canalUnique: Number.isInteger(d.canalUnique) && d.canalUnique >= 1 && d.canalUnique <= 16 ? d.canalUnique - 1 : null,
    pas: Math.round(num(d.pas, 80, 700, 240)), tonique: Math.round(num(d.tonique, 0, 11, 0)), octave: Math.round(num(d.octave, -3, 3, 0)),
    portee: num(d.portee, 1, 9, 2.5), mutation: !!d.mutation,
  } };
}

function applySetup(cfg) {
  silence();
  setTempo(cfg.pas);
  opt.tonic = cfg.tonique; $('tonic').value = opt.tonic;
  opt.octave = cfg.octave; $('octave').value = opt.octave;
  opt.softRange = cfg.portee; $('soft').value = opt.softRange;
  opt.mutate = cfg.mutation; $('mutate').checked = opt.mutate;
  Object.assign(snd, cfg.son);
  chanSnd.fill(null); for (const [ch, x] of Object.entries(cfg.sons)) chanSnd[+ch] = x;
  prog.fill(null); for (const [ch, p] of Object.entries(cfg.programmes)) prog[+ch] = p;
  selectSoundChannel(null); fillPrograms(); sendPrograms();
  // on reconstruit tous les hexagones : le nombre et la taille de la grille peuvent changer
  for (const s of slots.slice()) removeSlot(s, true);
  opt.scale = cfg.gamme; $('scaleBase').value = opt.scale;
  setChanAll(cfg.canalUnique);
  opt.uniform = cfg.uniforme; $('uniform').checked = opt.uniform;
  setGridSize(cfg.cols, cfg.rows);
  for (const c of cfg.slots) addSlot({ ...c, rot: c.rot });
}

// 24 notes proposées ; celles de la gamme de l'hexagone sont en couleur vive (classe `in`), les autres
// en gris (classe `out`), et la tonique est marquée
const noteOpts = (slot, withSilence, sel) => {
  if (sel === undefined) sel = null;
  const steps = scaleSteps(slot);
  let h = withSilence ? `<option value=""${sel === null ? ' selected' : ''}>${t('m.silence')}</option>` : '';
  for (let i = 0; i < 24; i++) {
    const cls = !steps || steps.includes(i % 12) ? 'in' : 'out';
    const st = cls === 'in' ? 'color:var(--yang);font-weight:700' : 'color:var(--dim)';
    h += `<option class="${cls}" style="${st}" value="${i}"${sel === i ? ' selected' : ''}>${steps && cls === 'in' ? '● ' : ''}${NAMES[(slotTonic(slot) + i) % 12]}${i >= 12 ? "'" : ''}${i % 12 === 0 ? t('m.tonicMark') : ''}</option>`;
  }
  return h;
};
// mélange l'ordre des notes personnalisées entre les traits. Gamme : toutes les notes (y compris celle qui
// n'avait pas de trait plein) sont redistribuées, les n premières sur les traits pleins, les autres sur des
// traits brisés au hasard. Chromatique : chaque paire plein / brisé reste ensemble.
// Si l'option n'est pas active, on part des notes de la gamme.
function shuffleCustom(slot) {
  if (!slot.customOn) fillCustom(slot);
  const c = slot.custom, n = slot.n;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  if (!SCALES[slot.mode].steps) shuffle(c);
  else {
    const pool = shuffle(c.flatMap(x => [x.p, x.b]).filter(v => v !== null));
    const where = shuffle(Array.from({ length: n }, (_, k) => k));
    c.forEach((x, k) => { x.p = k < pool.length ? pool[k] : null; x.b = null; });
    pool.slice(n).forEach((v, i) => { c[where[i]].b = v; });
  }
  slot.customOn = true;
  drawSlot(slot);
}

const SND_DEFAULT = { ...snd };

const envCv = $('envCv'), fltCv = $('fltCv');
const fcutToHz = v => 30 * Math.pow(16000 / 30, v), hzToFcut = f => Math.log(f / 30) / Math.log(16000 / 30);
const MAXA = 500, MAXD = 1000, MAXR = 1500;

// couleur d'une variable du thème (pour les canevas, qui ne lisent pas le CSS)
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// listes d'onde et de filtre dans la langue courante (réappelée au changement de langue)
function fillSoundLists() {

// géométrie du graphique : quatre quarts de largeur, la tenue (S) a une largeur fixe
function envPoints() {
  const W = envCv.width, H = envCv.height, x0 = 10, qw = (W - 20) / 4, top = 12, bot = H - 12;
  const xa = x0 + qw * cur.a / MAXA, xd = xa + qw * cur.d / MAXD, xs = xd + qw * 0.6, xr = xs + qw * cur.r / MAXR;
  const ys = bot - (bot - top) * cur.s;
  return { x0, qw, top, bot, pts: { a: [xa, top], d: [xd, ys], r: [xr, bot] }, xa, xd, xs, xr, ys };
}
function drawEnv() {
  const c = envCv.getContext('2d'), g = envPoints();
  c.clearRect(0, 0, envCv.width, envCv.height);
  c.strokeStyle = cssVar('--rule'); c.lineWidth = 1; c.beginPath();
  for (const x of [g.xa, g.xd, g.xs]) { c.moveTo(x, g.top); c.lineTo(x, g.bot); }
  c.stroke();
  c.beginPath(); c.moveTo(g.x0, g.bot); c.lineTo(g.xa, g.top); c.lineTo(g.xd, g.ys); c.lineTo(g.xs, g.ys); c.lineTo(g.xr, g.bot);
  c.globalAlpha = 0.18; c.fillStyle = cssVar('--yang'); c.fill(); c.globalAlpha = 1;
  c.strokeStyle = cssVar('--yang'); c.lineWidth = 2; c.stroke();
  c.fillStyle = cssVar('--ink');
  for (const [x, y] of Object.values(g.pts)) { c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill(); }

// courbe de réponse du filtre (échelle log en fréquence, de -40 à +24 dB)
function drawFilter() {
  const c = fltCv.getContext('2d'), W = fltCv.width, H = fltCv.height, n = 136;
  c.clearRect(0, 0, W, H);
  try {
    const f = new OfflineAudioContext(1, 1, 44100).createBiquadFilter();
    f.type = cur.ftype; f.frequency.value = cur.fcut; f.Q.value = cur.fq;
    const fr = new Float32Array(n), mag = new Float32Array(n), ph = new Float32Array(n);
    for (let i = 0; i < n; i++) fr[i] = 20 * Math.pow(1000, i / (n - 1));
    f.getFrequencyResponse(fr, mag, ph);
    const Y = m => H - 4 - (H - 8) * (Math.min(24, Math.max(-40, 20 * Math.log10(m || 1e-5))) + 40) / 64;
    c.strokeStyle = cssVar('--rule'); c.beginPath(); c.moveTo(0, Y(1)); c.lineTo(W, Y(1)); c.stroke();
    c.beginPath();
    for (let i = 0; i < n; i++) c[i ? 'lineTo' : 'moveTo'](W * i / (n - 1), Y(mag[i]));
    c.strokeStyle = cssVar('--yin'); c.lineWidth = 2; c.stroke();
    const xc = W * Math.log(cur.fcut / 20) / Math.log(1000);
    c.strokeStyle = cssVar('--dim'); c.setLineDash([3, 3]); c.beginPath(); c.moveTo(xc, 0); c.lineTo(xc, H); c.stroke(); c.setLineDash([]);
  } catch (_) { /* pas d'OfflineAudioContext : graphique omis */ }
}

// points déplaçables : A (abscisse), D et S (abscisse et ordonnée), R (abscisse)
let envDrag = null;
function envXY(e) {
  const r = envCv.getBoundingClientRect();
  return [(e.clientX - r.left) * envCv.width / r.width, (e.clientY - r.top) * envCv.height / r.height];
}
envCv.addEventListener('pointerdown', e => {
  const [x, y] = envXY(e), g = envPoints();
  let best = null, bd = 18;
  for (const [k, [px, py]] of Object.entries(g.pts)) { const d = Math.hypot(x - px, y - py); if (d < bd) { bd = d; best = k; } }

  const [x, y] = envXY(e), g = envPoints();

//: Encodeurs audio : WAV et FLAC (sans perte, 16 bits mono)
// ---------- Encodeurs audio ----------
// entrée : liste de blocs Int16Array (mono) et fréquence d'échantillonnage

function encodeWav(chunks, n, rate) {
  const buf = new ArrayBuffer(44 + 2 * n), v = new DataView(buf);
  const tag = (o, s) => { for (let i = 0; i < 4; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  tag(0, 'RIFF'); v.setUint32(4, 36 + 2 * n, true); tag(8, 'WAVE'); tag(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  tag(36, 'data'); v.setUint32(40, 2 * n, true);
  let o = 44;
  for (const c of chunks) for (let i = 0; i < c.length; i++, o += 2) v.setInt16(o, c[i], true);
  return new Uint8Array(buf);

const CRC8 = new Uint8Array(256), CRC16 = new Uint16Array(256);
for (let i = 0; i < 256; i++) {
  let a = i, b = i << 8;
  for (let k = 0; k < 8; k++) { a = a & 0x80 ? ((a << 1) ^ 0x07) & 255 : (a << 1) & 255; b = b & 0x8000 ? ((b << 1) ^ 0x8005) & 0xffff : (b << 1) & 0xffff; }
  CRC8[i] = a; CRC16[i] = b;
}
const crc8 = bytes => bytes.reduce((c, x) => CRC8[c ^ x], 0);

// écrivain de bits (poids fort d'abord) ; put(v, n) avec n <= 24
function bitWriter() {
  const out = []; let acc = 0, nb = 0;
  const w = {
    out,
    put(v, n) {
      acc = (acc << n) | (v & ((1 << n) - 1)); nb += n;
      while (nb >= 8) { nb -= 8; out.push((acc >> nb) & 255); }
      acc &= (1 << nb) - 1;
    },
    unary(q) { while (q >= 16) { w.put(0, 16); q -= 16; } w.put(1, q + 1); },   // q zéros puis un 1
    align() { if (nb) w.put(0, 8 - nb); },
  };
  return w;
}
// numéro de trame : nombre codé façon UTF-8
function utf8num(n) {
  if (n < 0x80) return [n];
  let len = 2;
  while (n >= Math.pow(2, 5 * len + 1)) len++;
  const tail = [];
  for (let i = 0; i < len - 1; i++) { tail.unshift(0x80 | (n & 0x3f)); n = Math.floor(n / 64); }
  return [((0xff00 >> len) & 0xff) | n, ...tail];
}
const zig = r => (r >= 0 ? 2 * r : -2 * r - 1);

// coût en bits du codage de Rice de u[a..b) avec le paramètre k
function riceBits(u, a, b, k) { let s = (b - a) * (k + 1); for (let i = a; i < b; i++) s += Math.floor(u[i] / (1 << k)); return s; }
function bestK(u, a, b) {
  let sum = 0; for (let i = a; i < b; i++) sum += u[i];
  const mean = sum / Math.max(1, b - a);
  const k0 = Math.max(0, Math.min(14, Math.floor(Math.log2(mean * 0.6931 + 1e-9))));
  let best = k0, bb = riceBits(u, a, b, k0);
  if (k0 < 14) { const c = riceBits(u, a, b, k0 + 1); if (c < bb) { bb = c; best = k0 + 1; } }
  return { k: best, bits: bb };
}

// résidus du prédicteur fixe d'ordre o (les o premiers échantillons restent en clair)
function fixedResidual(x, o) {
  const r = new Array(x.length - o);
  for (let i = o; i < x.length; i++) {
    r[i - o] = o === 0 ? x[i] : o === 1 ? x[i] - x[i - 1]
      : o === 2 ? x[i] - 2 * x[i - 1] + x[i - 2]
      : o === 3 ? x[i] - 3 * x[i - 1] + 3 * x[i - 2] - x[i - 3]
      : x[i] - 4 * x[i - 1] + 6 * x[i - 2] - 4 * x[i - 3] + x[i - 4];
  }
  return r;

    const a = j === 0 ? 0 : j * best.size - o, b = (j + 1) * best.size - o;
    w.put(k, 4);
    for (let i = a; i < b; i++) { w.unary(Math.floor(u[i] / (1 << k))); w.put(u[i] & ((1 << k) - 1), k); }
  });
}

function encodeFlac(chunks, n, rate) {
  const all = new Int16Array(n);
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const BS = 4096, w = bitWriter();
  for (const b of [0x66, 0x4c, 0x61, 0x43, 0x80, 0, 0, 34]) w.put(b, 8);     // "fLaC", bloc STREAMINFO (dernier)
  w.put(BS, 16); w.put(BS, 16); w.put(0, 24); w.put(0, 24);                 // tailles de bloc et de trame
  w.put(rate >> 4, 16); w.put(rate & 15, 4); w.put(0, 3); w.put(15, 5);      // fréquence, 1 canal, 16 bits
  w.put(Math.floor(n / 4294967296), 4); w.put(n >>> 16, 16); w.put(n & 0xffff, 16);   // nombre d'échantillons
  for (let i = 0; i < 16; i++) w.put(0, 8);                                  // MD5 non calculée
  const frames = Math.max(1, Math.ceil(n / BS));
  for (let f = 0; f < frames; f++) {
    const x = all.subarray(f * BS, Math.min(n, (f + 1) * BS)), len = x.length;
    const fw = bitWriter();
    fw.put(0xff, 8); fw.put(0xf8, 8);                                       // synchro, taille de bloc fixe
    fw.put(len === BS ? 12 : 7, 4); fw.put(0, 4);                           // taille de bloc, fréquence dans STREAMINFO
    fw.put(0, 4); fw.put(4, 3); fw.put(0, 1);                               // mono, 16 bits
    for (const b of utf8num(f)) fw.put(b, 8);
    if (len !== BS) fw.put(len - 1, 16);
    fw.put(crc8(fw.out), 8);
    if (len) flacSubframe(fw, Array.from(x)); else fw.put(0, 8), fw.put(0, 16);
    fw.align();
    fw.put(crc16(fw.out), 16);
    for (const b of fw.out) w.out.push(b);
  }
  return Uint8Array.from(w.out);
}

// ===== src/js/19-record-ui.js =====
//: Enregistrement : cases d'armement et boutons « Sauvegarder l'enregistrement » (MIDI, audio .flac / .wav)
// ---------- Enregistrement MIDI et audio ----------
const $recMsg = $('recMsg'), $arec = $('arec');
const recSay = m => { $recMsg.textContent = m; };

// MIDI : la case lance l'enregistrement, le bouton l'arrête et télécharge le fichier
$rec.addEventListener('change', () => {
  if ($rec.checked) { beginRecording(); recSay(t('recmsg.midi.on')); }
  else if (rec) { rec.live = false; recSay(t('recmsg.midi.off')); }
});
$recSave.addEventListener('click', () => {
  if (finishRecording()) { $rec.checked = false; recSay(t('recmsg.midi.saved')); }
  else recSay(t('recmsg.midi.none'));
});

// audio : on branche un ScriptProcessor sur le volume général ; les échantillons (Int16, mono) sont
// gardés en blocs. Rien n'est gardé avant le premier Jouer.
let arec = null, aproc = null;
function audioTap(on) {
  if (on && !aproc) {
    ensureAudio();
    aproc = ac.createScriptProcessor(4096, 1, 1);
    aproc.onaudioprocess = e => {
      if (!arec || !arec.live || !arec.started) return;
      const x = e.inputBuffer.getChannelData(0), out = new Int16Array(x.length);
      for (let i = 0; i < x.length; i++) {
        const v = Math.max(-1, Math.min(1, x[i]));
        out[i] = v < 0 ? v * 32768 : v * 32767;
      }
      arec.chunks.push(out); arec.n += out.length;
    };
    master.connect(aproc); aproc.connect(ac.destination);    // sa sortie reste muette
  } else if (!on && aproc) {
    master.disconnect(aproc); aproc.disconnect(); aproc.onaudioprocess = null; aproc = null;
  }
}
$arec.addEventListener('change', () => {
  if ($arec.checked) {
    audioTap(true);
    arec = { chunks: [], n: 0, live: true, started: running };
    recSay(t(running ? 'recmsg.audio.on' : 'recmsg.audio.wait'));
  } else if (arec) {
    arec.live = false; audioTap(false);
    recSay(t('recmsg.audio.off'));
  }
});
$arecSave.addEventListener('click', () => {
  if (!arec || !arec.n) { recSay(t('recmsg.audio.none')); return; }
  const fmt = $('afmt').value, r = arec;
  arec = null; $arec.checked = false; audioTap(false);
  const bytes = fmt === 'wav' ? encodeWav(r.chunks, r.n, ac.sampleRate) : encodeFlac(r.chunks, r.n, ac.sampleRate);
  download(bytes, `${fileBase()}-${fileStamp()}.${fmt}`, fmt === 'wav' ? 'audio/wav' : 'audio/flac');
  recSay(t('recmsg.audio.saved', fmt, (r.n / ac.sampleRate).toFixed(1)));
});

// ===== src/js/20-menubar.js =====
//: Barre de menus en haut : menus déroulants (un seul ouvert à la fois)
// ---------- Barre de menus ----------
const dds = Array.from(document.querySelectorAll('.dd'));
function closeDd(except) {
  for (const d of dds) if (d !== except) { d.classList.remove('open'); d.querySelector('.ddp').hidden = true; }
}
for (const d of dds) {
  const p = d.querySelector('.ddp');
  d.querySelector('.ddb').addEventListener('click', () => {
    const open = p.hidden;
    closeDd();
    p.hidden = !open; d.classList.toggle('open', open);
    if (open) {                                   // garde le menu dans la fenêtre
      p.style.marginLeft = '0px';
      const r = p.getBoundingClientRect();
      if (r.right > innerWidth - 4) p.style.marginLeft = (innerWidth - 4 - r.right) + 'px';
    }
  });
}
// les boutons marqués .closes referment leur menu après l'action
for (const b of document.querySelectorAll('.ddp .closes')) b.addEventListener('click', () => closeDd());
document.addEventListener('pointerdown', e => { if (!e.target.closest('.dd')) closeDd(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDd(); });

// ===== src/js/21-lang-theme.js =====
//: Langue (ENG / FRA) et thème : changement à chaud, mémorisé dans localStorage
// ---------- Langue et thème ----------
const THEMES = ['dark', 'light', 'sepia', 'green'];
let theme = 'dark';
try { const th = localStorage.getItem('hexacorde.theme'); if (THEMES.includes(th)) theme = th; } catch (_) { /* ignoré */ }

function fillThemeList() {
  $('theme').innerHTML = THEMES.map(k => `<option value="${k}">${t('theme.' + k)}</option>`).join('');
  $('theme').value = theme;
}
function applyTheme(name) {
  theme = name;
  document.documentElement.dataset.theme = name;
  try { localStorage.setItem('hexacorde.theme', name); } catch (_) { /* ignoré */ }
  showSound();                                    // les canevas du son relisent les couleurs du thème
}

// refait tout ce qui contient du texte : HTML statique, listes, blocs des hexagones, menus
function applyLang(l) {
  lang = l;
  try { localStorage.setItem('hexacorde.lang', l); } catch (_) { /* ignoré */ }
  document.documentElement.lang = l;
  NAMES.splice(0, 12, ...NOTE_NAMES[l]);
  closeMenu();
  translateDom(document);
  $('lang').value = l;
  $play.textContent = running ? t('pause') : t('play');
  fillTonalityLists(); fillSoundLists(); fillPrograms(); fillThemeList(); showSound();
  $('midiOut').options[0].textContent = t('midi.noout');
  if (midiAccess) refreshPorts();
  refreshList($setupList.value);
  svg.setAttribute('aria-label', t('grid.aria', NX, NY));
  // blocs du menu Hexagrammes : reconstruits dans l'ordre
  for (const s of slots) s.box.remove();
  for (const s of slots) { buildSlotPanel(s); drawSlot(s); }
  recSay('');
}
$('lang').addEventListener('change', e => applyLang(e.target.value));
$('theme').addEventListener('change', e => applyTheme(e.target.value));

// état initial
document.documentElement.dataset.theme = theme;
applyLang(lang);
applyTheme(theme);

// ===== src/js/99-start.js =====
//: Démarrage de l'animation
requestAnimationFrame(frame);
})();
